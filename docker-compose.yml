# Dev infrastructure (README §4.11). Services run from the IDE or ./mvnw spring-boot:run.
#   docker compose up -d                 # Postgres, Redis, Kafka, MinIO
#   docker compose --profile tools up -d # + Kafka UI on :8090
# Host ports avoid the defaults (5432/6379/9092) so a local PostgreSQL or another stack can
# keep running; override with RHL_POSTGRES_PORT / RHL_REDIS_PORT / RHL_KAFKA_PORT / RHL_MINIO_PORT.
name: rhl

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${RHL_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${RHL_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${RHL_KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${RHL_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are declared by the owning service (NewTopic beans), not auto-created on first use.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # S3-compatible object store for driver document files (user-service). The bucket is private
  # and created by user-service on start-up; console on :19001 (dev credentials below).
  # MinIO no longer publishes images on Docker Hub or quay.io; Chainguard builds it from source.
  # The image runs as a non-root user that cannot write a fresh volume, hence user 0 (dev only).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rhl-dev
      MINIO_ROOT_PASSWORD: rhl-dev-secret
    ports:
      - "${RHL_MINIO_PORT:-19000}:9000"
      - "${RHL_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data

  kafka-ui:
    profiles: [tools]
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rhl-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
