server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: pricing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:15432/pricing_db}
    username: ${PRICING_DB_USER:pricing_svc}
    password: ${PRICING_DB_PASSWORD:pricing_svc}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

rhl:
  jwt:
    issuer: rhl-user-service
  region-code: DEFAULT
  # Placeholders until TBD-05 (quote validity) and TBD-03 (rounding) are decided.
  quote:
    ttl: 5m
    rounding-step: 1000
    min-distance-meters: 200
    max-distance-meters: 100000
  # Straight-line estimate until a Map Provider is chosen (TBD-02).
  route:
    road-factor: 1.35
    average-speed-kmh: 22
    min-duration-seconds: 60
  # Nothing is published yet; FareFinalized and CancellationFeeCalculated come with final fares.
  outbox:
    enabled: false

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
