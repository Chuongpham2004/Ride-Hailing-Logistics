server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: location-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LOCATION_DB_URL:jdbc:postgresql://localhost:15432/location_db}
    username: ${LOCATION_DB_USER:location_svc}
    password: ${LOCATION_DB_PASSWORD:location_svc}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Telemetry path: keep batching delay small for the 500 ms end-to-end budget (NFR-PERF-001).
        linger.ms: 5
    consumer:
      group-id: location-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

rhl:
  jwt:
    issuer: rhl-user-service
  # Placeholders until TBD-14 (location thresholds) and TBD-12 (retention) are decided.
  telemetry:
    location-ttl: 30s
    max-accuracy-meters: 50
    max-clock-skew: 10s
    max-report-age: 24h
    max-speed-meters-per-second: 70
    sequence-ttl: 24h
    history-retention-days: 30
    cleanup-interval: 5s
  nearby:
    default-radius-meters: 2000
    max-radius-meters: 10000
    default-limit: 10
    max-limit: 50
  kafka:
    partitions: 3
    replicas: 1
    telemetry-concurrency: 3
  # Location updates are high-frequency and short-lived, so they are sent straight to Kafka
  # (README §4.7) and this service has no outbox table.
  outbox:
    enabled: false

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
