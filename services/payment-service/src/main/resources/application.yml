server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:15432/payment_db}
    username: ${PAYMENT_DB_USER:payment_svc}
    password: ${PAYMENT_DB_PASSWORD:payment_svc}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

rhl:
  jwt:
    issuer: rhl-user-service
  charge:
    # An attempt with no recorded outcome after this long is sent again with the same key.
    resolve-after: 30s
    # Accepted by the provider: wait this long for its callback before asking again.
    callback-timeout: 15m
    resolve-every: 10s
    resolve-batch: 50
    max-attempts: 5
  provider:
    # Shared with the provider; set PAYMENT_WEBHOOK_SECRET outside local development.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
    signature-tolerance: 5m
  wallet:
    # VND; finance adjustments above this need a separate, reviewed process.
    max-adjustment: 5000000
  kafka:
    partitions: 3
    replicas: 1
  # PaymentSucceeded / PaymentFailed (payment.events.v1), DriverEarningPosted (wallet.events.v1).
  outbox:
    poll-interval: 200ms
    batch-size: 100

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
