name: PR quality

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message, so it must follow
      # Conventional Commits (feat, fix, docs, chore, ...).
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            gateway
            realtime
            user
            location
            trip
            pricing
            payment
            libs
            contracts
            simulator
            frontend
            deps
            deps-dev
            ci
            docs
          requireScope: false
          # Dependabot always capitalises its subject ("Bump ..."), so the
          # lowercase rule only applies to PRs opened by people.
          subjectPattern: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '^.+$' || '^(?![A-Z]).+$' }}
          subjectPatternError: The subject "{subject}" must not start with an uppercase letter.
