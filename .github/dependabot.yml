version: 2

# All update PRs target develop so they go through the normal promotion flow.
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, java]
    groups:
      spring:
        patterns: ['org.springframework*', 'io.micrometer*']
      testing:
        patterns: ['org.junit*', 'org.mockito*', 'org.testcontainers*', 'org.awaitility*', 'org.assertj*']
      maven-plugins:
        patterns: ['org.apache.maven.plugins*', 'org.jacoco*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: build
    labels: [dependencies, docker]
